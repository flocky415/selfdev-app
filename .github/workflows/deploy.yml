name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Якщо задано JARVIS_PROXY_URL (Cloudflare Worker) — ключ Gemini на сайт НЕ потрапляє.
      # Інакше, для сумісності, ключ кладеться у файл (його видно в браузері — краще налаштуй проксі).
      - name: Create gemini-config.js
        env:
          JARVIS_PROXY_URL: ${{ secrets.JARVIS_PROXY_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$JARVIS_PROXY_URL" ]; then
            printf 'const geminiConfig = { proxyUrl: "%s" };\n' "$JARVIS_PROXY_URL" > gemini-config.js
          else
            printf 'const geminiConfig = { apiKey: "%s" };\n' "$GEMINI_API_KEY" > gemini-config.js
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
